[tool.poetry]
name = "agwb"
version = "0.0.1"
description = "Register access for hierarchical Wishbone connected systems"
authors = ["Wojciech M. Zabolotny"]

[tool.poetry.dependencies]
python = "^3.6.9"
pydantic = "^1.8.1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
agwb = 'agwb:main'
